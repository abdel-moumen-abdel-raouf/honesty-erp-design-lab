<label class="review-select__field">
  <erp-text
    class="review-select__label"
    type="caption"
    weight="bold"
    tone="secondary"
  >
    {{ label() }}
  </erp-text>
  <select
    class="review-select__native"
    [value]="value()"
    (change)="selectionChanged.emit($event)"
  >
    @for (choice of choices(); track choice.value()) {
      <option
        [value]="choice.value()"
        [disabled]="choice.disabled()"
        [selected]="choice.value() === value()"
        [attr.label]="choice.label()"
        [attr.aria-label]="choice.label()"
      ></option>
    }
  </select>
</label>
<span class="review-select__choices" aria-hidden="true">
  <ng-content></ng-content>
</span>
