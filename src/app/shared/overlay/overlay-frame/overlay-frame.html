<div class="overlay-frame">
  <header class="overlay-frame__header">
    <erp-icon
      class="overlay-frame__icon"
      [name]="config().header.icon"
      size="inherit"
      tone="primary"
    />
    <div class="overlay-frame__heading">
      <erp-text [id]="titleId()" type="heading-3">
        {{ config().header.title }}
      </erp-text>
      <erp-text [id]="subtitleId()" type="paragraph" tone="secondary">
        {{ config().header.subtitle }}
      </erp-text>
    </div>
    <erp-tooltip [text]="closeLabel()">
      <erp-icon-button
        data-overlay-frame-close
        icon="close"
        [label]="closeLabel()"
        (pressed)="close()"
      />
    </erp-tooltip>
  </header>

  <div class="overlay-frame__body">
    <ng-content></ng-content>
  </div>

  <footer class="overlay-frame__footer">
    <erp-button
      data-overlay-frame-secondary
      [label]="config().footer.secondary.label"
      [icon]="config().footer.secondary.icon ?? null"
      variant="outline"
      tone="neutral"
      [disabled]="config().footer.secondary.disabled ?? false"
      [loading]="config().footer.secondary.loading ?? false"
      (pressed)="request('secondary')"
    />
    <erp-button
      data-overlay-frame-primary
      [label]="config().footer.primary.label"
      [icon]="config().footer.primary.icon ?? null"
      tone="primary"
      [disabled]="config().footer.primary.disabled ?? false"
      [loading]="config().footer.primary.loading ?? false"
      (pressed)="request('primary')"
    />
  </footer>
</div>
