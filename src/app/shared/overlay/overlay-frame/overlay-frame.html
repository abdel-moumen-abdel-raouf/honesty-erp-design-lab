<div class="overlay-frame">
  <header class="overlay-frame__header">
    <erp-icon
      class="overlay-frame__icon"
      [name]="config().header.icon"
      size="inherit"
      tone="primary"
    />
    <div class="overlay-frame__heading">
      <erp-text [id]="titleId()" type="heading-3">
        {{ config().header.title }}
      </erp-text>
      <erp-text [id]="subtitleId()" type="caption" tone="secondary">
        {{ config().header.subtitle }}
      </erp-text>
    </div>
    <erp-tooltip [text]="closeLabel()">
      <erp-icon-button
        data-overlay-frame-close
        icon="close"
        [label]="closeLabel()"
        (pressed)="close()"
      />
    </erp-tooltip>
  </header>

  <div class="overlay-frame__body">
    <ng-content></ng-content>
  </div>

  <footer class="overlay-frame__footer">
    <div class="overlay-frame__action-group" data-overlay-frame-action-group="start">
      @for (action of startActions(); track action.id) {
        <erp-button
          data-overlay-frame-action
          [attr.data-overlay-frame-action-id]="action.id"
          [attr.data-overlay-frame-action-role]="action.role"
          [label]="action.label"
          [icon]="action.icon ?? null"
          [variant]="buttonVariant(action.role)"
          [tone]="buttonTone(action.role)"
          [disabled]="action.disabled"
          [loading]="action.loading"
          (pressed)="request(action.id)"
        />
      }
    </div>
    <div class="overlay-frame__action-group" data-overlay-frame-action-group="end">
      @for (action of endActions(); track action.id) {
        <erp-button
          data-overlay-frame-action
          [attr.data-overlay-frame-action-id]="action.id"
          [attr.data-overlay-frame-action-role]="action.role"
          [label]="action.label"
          [icon]="action.icon ?? null"
          [variant]="buttonVariant(action.role)"
          [tone]="buttonTone(action.role)"
          [disabled]="action.disabled"
          [loading]="action.loading"
          (pressed)="request(action.id)"
        />
      }
    </div>
  </footer>
</div>
