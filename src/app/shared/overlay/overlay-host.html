@for (entry of manager.entries(); track entry.ref.id; let index = $index) {
  <div
    class="erp-ol"
    [attr.data-overlay-layer]="index"
    [attr.data-overlay-top]="manager.isTop(entry.ref.id)"
    [attr.data-overlay-kind]="entry.ref.config.kind"
    [attr.data-overlay-position]="entry.ref.config.position"
    [attr.data-overlay-size]="entry.ref.config.size"
    [attr.data-overlay-blur]="entry.ref.config.blur"
    [attr.data-overlay-backdrop-tone]="entry.ref.config.backdropTone"
    [attr.data-overlay-phase]="entry.phase"
    [attr.data-overlay-animation]="entry.animation"
    [attr.inert]="manager.isTop(entry.ref.id) ? null : ''"
    (pointerdown)="handleBackdropPointerDown($event, entry.ref.id)"
  >
    <section
      class="erp-os"
      [id]="entry.ref.id"
      role="dialog"
      tabindex="-1"
      [attr.data-overlay-id]="entry.ref.id"
      [attr.aria-labelledby]="entry.ref.config.frame?.showHeader ? entry.ref.id + '-title' : null"
      [attr.aria-describedby]="entry.ref.config.frame?.showHeader ? entry.ref.id + '-subtitle' : null"
      [attr.aria-label]="entry.ref.config.frame && !entry.ref.config.frame.showHeader ? entry.ref.config.frame.header.title : entry.ref.config.legacyCompactMenuLabel"
      [attr.aria-description]="entry.ref.config.frame && !entry.ref.config.frame.showHeader ? entry.ref.config.frame.header.subtitle : null"
      [attr.aria-modal]="entry.ref.config.blocking ? 'true' : null"
      [attr.aria-hidden]="manager.isTop(entry.ref.id) ? null : 'true'"
    >
      @if (entry.ref.config.frame; as frame) {
        @defer (on immediate) {
          <erp-overlay-frame
            [config]="frame"
            [ref]="entry.ref"
            (ready)="handleFrameReady(entry.ref.id)"
          >
            <ng-container
              *ngComponentOutlet="entry.component; injector: entry.injector"
            ></ng-container>
          </erp-overlay-frame>
        }
      } @else {
        <ng-container
          *ngComponentOutlet="entry.component; injector: entry.injector"
        ></ng-container>
      }
    </section>
  </div>
}
