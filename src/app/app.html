<div id="lab-capture-root" class="lab-capture-root" [attr.data-theme]="theme()">
  @defer (on immediate) {
  <erp-app-shell
    id="design-lab-app-shell"
    [attr.data-showcase-target]="isAppShellShowcase() ? '' : null"
    [attr.data-app-shell-root-workbench]="isAppShellShowcase() ? 'true' : null"
    [navigationItems]="shellNavigationItems()"
    [activeNavigationId]="shellActiveNavigationId()"
    [sidebarLabel]="shellSidebarLabel()"
    [contentLabel]="shellContentLabel()"
    [quickActionGroups]="shellQuickActionGroups()"
    [quickActionsLabel]="shellQuickActionsLabel()"
    [footer]="shellFooter()"
    [viewport]="shellViewport()"
    [sidebarOpen]="shellSidebarOpen()"
    (sidebarOpenChange)="handleSidebarOpenChange($event)"
    [sidebarCollapsed]="shellSidebarCollapsed()"
    (sidebarCollapsedChange)="handleSidebarCollapsedChange($event)"
    (navigationActivated)="navigate($event)"
    (quickActionActivated)="handleQuickAction($event)"
    (footerActionActivated)="handleFooterAction($event)"
  >
    <erp-inline erpAppShellTopbarStart class="lab-shell-brand" gap="tight" align="center">
      <erp-tooltip text="فهرس المكوّنات" placement="bottom">
        <erp-icon-button
          id="btn-component-catalog"
          icon="menu"
          label="فهرس المكوّنات"
          variant="ghost"
          [ariaExpanded]="catalogOpen()"
          ariaControls="design-lab-app-shell"
          (pressed)="toggleCatalog()"
        />
      </erp-tooltip>
      <erp-text class="lab-shell-title" type="strong">Honesty ERP</erp-text>
    </erp-inline>

    <erp-branch-selector
      erpAppShellTopbarContext
      [branches]="branches"
      labelMode="visually-hidden"
      [value]="branchId()"
      (valueChange)="branchId.set($event)"
    />

    <erp-global-search
      erpAppShellTopbarSearch
      [results]="searchResults"
      (resultActivated)="activateSearchResult($event.id)"
    />

    <erp-inline erpAppShellTopbarActions class="lab-shell-actions" gap="tight" align="center">
      @if (statusMessage()) {
        <erp-text id="lab-screenshot-status" type="caption" [tone]="hasError() ? 'danger' : 'secondary'">
          {{ statusMessage() }}
        </erp-text>
      }
      <erp-applications-menu [groups]="applicationGroups" />
      <erp-messages-menu [messages]="messages" />
      <erp-notification-bell [notifications]="notifications" />
      <erp-tooltip [text]="theme() === 'light' ? 'السمة الداكنة' : 'السمة الفاتحة'" placement="bottom">
        <erp-icon-button
          id="btn-lab-theme"
          data-wave-a-theme-evidence
          [icon]="theme() === 'light' ? 'moon' : 'sun'"
          [label]="theme() === 'light' ? 'السمة الداكنة' : 'السمة الفاتحة'"
          variant="ghost"
          (pressed)="toggleTheme()"
        />
      </erp-tooltip>
      <erp-button
        id="btn-full-page-screenshot"
        data-wave-a-screenshot-evidence
        class="lab-screenshot-wide"
        [disabled]="isCapturing()"
        [loading]="isCapturing()"
        size="sm"
        variant="outline"
        icon="download"
        [label]="isCapturing() ? 'جاري الالتقاط...' : 'لقطة كاملة'"
        (pressed)="captureScreenshot()"
      />
      <erp-tooltip text="لقطة كاملة" placement="bottom">
        <erp-icon-button
          class="lab-screenshot-narrow"
          icon="download"
          label="لقطة كاملة"
          variant="ghost"
          [disabled]="isCapturing()"
          (pressed)="captureScreenshot()"
        />
      </erp-tooltip>
    </erp-inline>

    <erp-user-menu
      erpAppShellTopbarUser
      [user]="user"
      [items]="userItems"
      [compactTriggerAtNarrow]="true"
    />

    <router-outlet id="app-router-outlet" />
  </erp-app-shell>
  }

  <erp-overlay-host />
</div>
