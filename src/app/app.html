<div
  id="lab-capture-root"
  class="lab-capture-root"
  [attr.data-theme]="theme()"
>
  <header id="lab-utility-bar" class="lab-utility-bar">
    <div id="lab-utility-brand" class="lab-utility-brand">
      <span id="lab-utility-title" class="lab-utility-title">مختبر تصميم Honesty ERP</span>
    </div>
    <div id="lab-actions" class="lab-actions">
      @if (statusMessage()) {
        <erp-text id="lab-screenshot-status" class="lab-screenshot-status" type="caption" [tone]="hasError() ? 'danger' : 'secondary'">
          {{ statusMessage() }}
        </erp-text>
      }
      <erp-button
        id="btn-component-catalog"
        size="sm"
        variant="outline"
        label="فهرس المكوّنات"
        [ariaExpanded]="catalogOpen()"
        ariaControls="lab-component-catalog"
        (pressed)="toggleCatalog()"
      />
      <erp-button
        id="btn-lab-theme"
        data-wave-a-theme-evidence
        class="btn-theme"
        size="sm"
        variant="outline"
        [label]="theme() === 'light' ? 'السمة الداكنة' : 'السمة الفاتحة'"
        (pressed)="toggleTheme()"
      />
      <erp-button
        id="btn-full-page-screenshot"
        data-wave-a-screenshot-evidence
        class="btn-screenshot"
        [disabled]="isCapturing()"
        [loading]="isCapturing()"
        size="sm"
        variant="outline"
        [label]="isCapturing() ? 'جاري الالتقاط...' : 'لقطة كاملة'"
        (pressed)="captureScreenshot()"
      />
    </div>
  </header>
  <div class="lab-workspace" [class.lab-workspace--catalog-open]="catalogOpen()">
    @defer {
      <app-review-catalog-navigation
        id="lab-component-catalog"
        [open]="catalogOpen()"
        (closeRequested)="closeCatalog()"
      />
    }
    <main id="routed-review-content" class="routed-content-wrapper">
      <router-outlet id="app-router-outlet"></router-outlet>
    </main>
  </div>

  <erp-overlay-host />
</div>
