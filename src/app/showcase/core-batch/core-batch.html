<erp-container class="core-batch" width="wide"><erp-stack gap="loose">
<erp-stack gap="tight"><erp-text type="heading-1">مراجعة المكوّنات الأساسية المجمعة</erp-text><erp-text type="paragraph" tone="secondary">سطح مراجعة عربي موحد للمكوّنات الثمانية، يرث ثيم التطبيق واتجاهه دون سلطة محلية.</erp-text></erp-stack>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Select</erp-text><erp-grid [columns]="2" gap="lg" responsive="auto"><erp-select label="الموظف المسؤول" [options]="employeeOptions" [(ngModel)]="selectedEmployee" helperText="اختيار مفرد مع بحث وتجميع وترتيب" /><erp-select label="فريق المراجعة" [options]="employeeOptions" multiple selectSize="lg" placeholder="اختر أعضاء الفريق" /></erp-grid></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">StatusBadge</erp-text><erp-grid [columns]="5" gap="sm" responsive="auto"><erp-status-badge label="محايد" /><erp-status-badge label="ناجح" tone="success" icon="success" /><erp-status-badge label="تحذير" tone="warning" icon="warning" /><erp-status-badge label="خطر" tone="danger" icon="error" /><erp-status-badge label="معلومة" tone="info" icon="info" /></erp-grid></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Alert</erp-text><erp-alert title="تم حفظ القيد" description="حُفظ القيد المحاسبي بنجاح." tone="success" /><erp-alert title="تحتاج العملية إلى مراجعة" description="تحقق من مركز التكلفة قبل الاعتماد." tone="warning" dismissible /></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Skeleton</erp-text><erp-grid [columns]="3" gap="lg" responsive="auto"><erp-skeleton [lines]="3" /><erp-skeleton variant="block" /><erp-skeleton variant="circle" size="lg" /></erp-grid></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Avatar</erp-text><erp-grid [columns]="5" gap="lg" responsive="auto"><erp-avatar name="أحمد علي" size="xs" /><erp-avatar name="سارة محمود" size="sm" /><erp-avatar name="محمد حسن" /><erp-avatar name="نور خالد" size="lg" shape="rounded" /><erp-avatar name="" size="xl" fallbackIcon="user" /></erp-grid></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Tabs</erp-text><erp-surface border="subtle"><erp-tabs [items]="tabs" activeId="summary" /></erp-surface></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Table</erp-text><erp-table caption="دليل الحسابات" [columns]="columns" [rows]="rows" selectable [selectedKeys]="['2']" /></erp-stack></erp-section>
<erp-section><erp-stack gap="default"><erp-text type="heading-2">Pagination</erp-text><erp-pagination [page]="page()" [pageCount]="12" [totalItems]="286" [pageSize]="pageSize()" (pageChange)="page.set($event)" (pageSizeChange)="pageSize.set($event)" /></erp-stack></erp-section>
</erp-stack></erp-container>
