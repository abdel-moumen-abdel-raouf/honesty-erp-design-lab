<erp-stack
  gap="default"
  [attr.data-theme]="data.theme"
  data-overlay-content-evidence
>
  <erp-text type="heading-2">{{ data.title }}</erp-text>
  <erp-text type="paragraph">
    محتوى تراكب حاجب يثبت التركيز والإغلاق واستعادة التركيز.
  </erp-text>
  @if (data.allowNested) {
    <erp-button label="فتح تراكب متداخل" (pressed)="openNested()" />
  }
  <erp-button label="إغلاق التراكب" (pressed)="ref.close('confirmed')" />
</erp-stack>
