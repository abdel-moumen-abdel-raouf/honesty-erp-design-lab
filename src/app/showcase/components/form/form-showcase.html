<erp-stack gap="default" data-dedicated-showcase="form" data-showcase-sections="1">
  <erp-text type="heading-2">نموذج</erp-text>
  <erp-text type="paragraph" tone="secondary">حد form الدلالي مع نوايا الإرسال وإعادة الضبط.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-form
          data-showcase-target
          [label]="$any(value('label'))"
          [description]="$any(value('description'))"
          [disabled]="$any(value('disabled'))"
          [busy]="$any(value('busy'))"
          (submitRequested)="recordEvent('submitRequested', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ><erp-form-section title="بيانات المورد" description="أدخل البيانات الأساسية المطلوبة للحفظ"><erp-text-box label="اسم المورد" /><erp-text-box label="الرقم الضريبي" /></erp-form-section><erp-form-actions><erp-button erpFormActionsSecondary label="إعادة الضبط" type="reset" variant="outline" /><erp-button erpFormActionsPrimary label="حفظ المورد" type="submit" /></erp-form-actions></erp-form>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
