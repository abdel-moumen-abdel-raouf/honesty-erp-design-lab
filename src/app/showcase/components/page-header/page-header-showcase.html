<erp-stack gap="default" data-dedicated-showcase="page-header" data-showcase-sections="1">
  <erp-text type="heading-2">رأس الصفحة</erp-text>
  <erp-text type="paragraph" tone="secondary">عنوان الصفحة والوصف والبيانات والإجراءات المسقطة.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-page-header
          [title]="$any(cases[0].inputs['title'])"
        ><erp-text erpPageHeaderBreadcrumbs type="caption">الرئيسية / الحسابات</erp-text><erp-text erpPageHeaderMeta type="caption">حالة السجل: نشط</erp-text><erp-button erpPageHeaderPrimaryAction label="حفظ" /></erp-page-header>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
