<erp-stack gap="default" data-dedicated-showcase="page-header" data-showcase-sections="1">
  <erp-text type="heading-2">رأس الصفحة</erp-text>
  <erp-text type="paragraph" tone="secondary">عنوان الصفحة والوصف والبيانات والإجراءات المسقطة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-page-header
          data-showcase-target
          [title]="$any(value('title'))"
          [subtitle]="$any(value('subtitle'))"
        ><erp-text erpPageHeaderBreadcrumbs type="caption">الرئيسية / الحسابات / دليل الحسابات</erp-text><erp-text erpPageHeaderMeta type="caption">آخر تحديث: اليوم، 10:30</erp-text><erp-button erpPageHeaderSecondary label="تصدير" variant="outline" (pressed)="recordEvent('secondaryActionPressed', true)" /><erp-button erpPageHeaderPrimary label="إضافة حساب" icon="add" (pressed)="recordEvent('primaryActionPressed', true)" /></erp-page-header>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
