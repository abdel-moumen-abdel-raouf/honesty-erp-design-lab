<erp-stack gap="default" data-dedicated-showcase="select" data-showcase-sections="1">
  <erp-text type="heading-2">قائمة الاختيار</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار مفرد أو متعدد مع بحث وتجميع.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/select/ERP_SELECT_REFERENCE_EXACT_V3.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-select
          data-showcase-target
          [label]="$any(value('label'))"
          [name]="$any(value('name'))"
          [form]="$any(value('form'))"
          [required]="$any(value('required'))"
          [externalValidationIssues]="$any(value('externalValidationIssues'))"
          [tone]="$any(value('tone'))"
          [status]="$any(value('status'))"
          [variant]="$any(value('variant'))"
          [borderMode]="$any(value('borderMode'))"
          [shape]="$any(value('shape'))"
          [size]="$any(value('size'))"
          [appearance]="$any(value('appearance'))"
          [labelMode]="$any(value('labelMode'))"
          [floatingPosition]="$any(value('floatingPosition'))"
          [helperText]="$any(value('helperText'))"
          [helperPosition]="$any(value('helperPosition'))"
          [leadingIcon]="$any(value('leadingIcon'))"
          [trailingIcon]="$any(value('trailingIcon'))"
          [clearable]="$any(value('clearable'))"
          [feedbackText]="$any(value('feedbackText'))"
          [feedbackDismissible]="$any(value('feedbackDismissible'))"
          [options]="$any(value('options'))"
          [multiple]="$any(value('multiple'))"
          [searchable]="$any(value('searchable'))"
          [filterable]="$any(value('filterable'))"
          [sortable]="$any(value('sortable'))"
          [showIcons]="$any(value('showIcons'))"
          [showImages]="$any(value('showImages'))"
          [selectAll]="$any(value('selectAll'))"
          [maxSelected]="$any(value('maxSelected'))"
          [maxChips]="$any(value('maxChips'))"
          [placeholder]="$any(value('placeholder'))"
          [searchPlaceholder]="$any(value('searchPlaceholder'))"
          [searchLabel]="$any(value('searchLabel'))"
          [emptyText]="$any(value('emptyText'))"
          [selectSize]="$any(value('selectSize'))"
          [selectAppearance]="$any(value('selectAppearance'))"
          [placement]="$any(value('placement'))"
          [groupBy]="$any(value('groupBy'))"
          [sortMode]="$any(value('sortMode'))"
          [filterPredicate]="$any(value('filterPredicate'))"
          [filterFn]="$any(value('filterFn'))"
          [comparator]="$any(value('comparator'))"
          [sort]="$any(value('sort'))"
          (sortChange)="recordModel('sort', $event)"
          (selectionChange)="recordEvent('selectionChange', $event)"
          (opened)="recordEvent('opened', $event)"
          (closed)="recordEvent('closed', $event)"
          (cleared)="recordEvent('cleared', $event)"
          (searchChange)="recordEvent('searchChange', $event)"
          [formControl]="control"
          data-showcase-cva-disabled-control
        ></erp-select>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
      <erp-text type="caption" selectable>القيمة الحالية: {{ cvaValue() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
