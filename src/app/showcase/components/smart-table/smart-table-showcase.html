<erp-stack gap="default" data-dedicated-showcase="smart-table" data-showcase-sections="1">
  <erp-text type="heading-2">الجدول الذكي</erp-text>
  <erp-text type="paragraph" tone="secondary">تركيب مضبوط للجدول والأدوات والصفحات والحالات.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-smart-table
          data-showcase-target
          [caption]="$any(value('caption'))"
          [columns]="$any(value('columns'))"
          [rows]="$any(value('rows'))"
          [mode]="$any(value('mode'))"
          [rowKey]="$any(value('rowKey'))"
          [loading]="$any(value('loading'))"
          [error]="$any(value('error'))"
          [totalItems]="$any(value('totalItems'))"
          [selectable]="$any(value('selectable'))"
          [compact]="$any(value('compact'))"
          [filterDefinitions]="$any(value('filterDefinitions'))"
          [pageSizeOptions]="$any(value('pageSizeOptions'))"
          [page]="$any(value('page'))"
          (pageChange)="recordModel('page', $event)"
          [pageSize]="$any(value('pageSize'))"
          (pageSizeChange)="recordModel('pageSize', $event)"
          [sort]="$any(value('sort'))"
          (sortChange)="recordModel('sort', $event)"
          [filters]="$any(value('filters'))"
          (filtersChange)="recordModel('filters', $event)"
          [visibleColumns]="$any(value('visibleColumns'))"
          (visibleColumnsChange)="recordModel('visibleColumns', $event)"
          [selectedKeys]="$any(value('selectedKeys'))"
          (selectedKeysChange)="recordModel('selectedKeys', $event)"
          (queryChanged)="recordEvent('queryChanged', $event)"
          (rowActivated)="recordEvent('rowActivated', $event)"
          (refreshRequested)="recordEvent('refreshRequested', $event)"
          (exportRequested)="recordEvent('exportRequested', $event)"
        ></erp-smart-table>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
