<erp-stack gap="default" data-dedicated-showcase="smart-table" data-showcase-sections="6">
  <erp-text type="heading-2">الجدول الذكي</erp-text>
  <erp-text type="paragraph" tone="secondary">تركيب مضبوط للجدول والأدوات والصفحات والحالات.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-smart-table
          [caption]="$any(cases[0].inputs['caption'])"
          [columns]="$any(cases[0].inputs['columns'])"
          [rows]="$any(cases[0].inputs['rows'])"
          [page]="$any(modelValue('default:page', cases[0].inputs['page']))"
          (pageChange)="recordModel('default:page', $event)"
          [pageSize]="$any(modelValue('default:pageSize', cases[0].inputs['pageSize']))"
          (pageSizeChange)="recordModel('default:pageSize', $event)"
          [sort]="$any(modelValue('default:sort', cases[0].inputs['sort']))"
          (sortChange)="recordModel('default:sort', $event)"
          [filters]="$any(modelValue('default:filters', cases[0].inputs['filters']))"
          (filtersChange)="recordModel('default:filters', $event)"
          [visibleColumns]="$any(modelValue('default:visibleColumns', cases[0].inputs['visibleColumns']))"
          (visibleColumnsChange)="recordModel('default:visibleColumns', $event)"
          [selectedKeys]="$any(modelValue('default:selectedKeys', cases[0].inputs['selectedKeys']))"
          (selectedKeysChange)="recordModel('default:selectedKeys', $event)"
          (queryChanged)="recordEvent('queryChanged', $event)"
          (rowActivated)="recordEvent('rowActivated', $event)"
          (refreshRequested)="recordEvent('refreshRequested', $event)"
          (exportRequested)="recordEvent('exportRequested', $event)"
        ></erp-smart-table>
      </erp-stack>
    </erp-surface>
