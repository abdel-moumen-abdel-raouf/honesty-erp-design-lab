<erp-stack gap="default" data-dedicated-showcase="avatar-picker" data-showcase-sections="8">
  <erp-text type="heading-2">منتقي الصورة الرمزية</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار صورة رمزية مضبوطة من الفهرس.</erp-text>
  <erp-text type="heading-2">مرجع Product Owner الدقيق</erp-text>
  <app-review-exact-core-showcase [focus]="'avatar-picker'" />
  <erp-text type="heading-2">واجهة API والتوافق</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-avatar-picker
          [value]="$any(modelValue('default:value', cases[0].inputs['value']))"
          (valueChange)="recordModel('default:value', $event)"
          [gender]="$any(modelValue('default:gender', cases[0].inputs['gender']))"
          (genderChange)="recordModel('default:gender', $event)"
          (changed)="recordEvent('changed', $event)"
          (pick)="recordEvent('pick', $event)"
          (confirm)="recordEvent('confirm', $event)"
          (cancelRequested)="recordEvent('cancelRequested', $event)"
        ></erp-avatar-picker>
      </erp-stack>
    </erp-surface>
