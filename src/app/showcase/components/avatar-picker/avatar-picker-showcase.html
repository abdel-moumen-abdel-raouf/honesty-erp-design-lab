<erp-stack gap="default" data-dedicated-showcase="avatar-picker" data-showcase-sections="1">
  <erp-text type="heading-2">منتقي الصورة الرمزية</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار صورة رمزية مضبوطة من الفهرس.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/avatar-picker/ERP_AVATAR_PICKER_REFERENCE_EXACT_V1.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-avatar-picker
          data-showcase-target
          [avatars]="$any(value('avatars'))"
          [title]="$any(value('title'))"
          [label]="$any(value('label'))"
          [subtitle]="$any(value('subtitle'))"
          [searchable]="$any(value('searchable'))"
          [showConfirm]="$any(value('showConfirm'))"
          [showCount]="$any(value('showCount'))"
          [searchPlaceholder]="$any(value('searchPlaceholder'))"
          [emptyText]="$any(value('emptyText'))"
          [confirmLabel]="$any(value('confirmLabel'))"
          [cancelLabel]="$any(value('cancelLabel'))"
          [savedLabel]="$any(value('savedLabel'))"
          [disabled]="$any(value('disabled'))"
          [size]="$any(value('size'))"
          [avatarShape]="$any(value('avatarShape'))"
          [avatarSize]="$any(value('avatarSize'))"
          [value]="$any(value('value'))"
          (valueChange)="recordModel('value', $event)"
          [gender]="$any(value('gender'))"
          (genderChange)="recordModel('gender', $event)"
          (changed)="recordEvent('changed', $event)"
          (pick)="recordEvent('pick', $event)"
          (confirm)="recordEvent('confirm', $event)"
          (cancelRequested)="recordEvent('cancelRequested', $event)"
        ></erp-avatar-picker>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
