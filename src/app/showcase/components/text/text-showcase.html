<erp-stack gap="default" data-dedicated-showcase="text" data-showcase-sections="1">
  <erp-text type="heading-2">النص</erp-text>
  <erp-text type="paragraph" tone="secondary">بوابة النصوص الإنتاجية وأدوارها الدلالية.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-text
          data-showcase-target
          class="showcase-text-target"
          [type]="$any(value('type'))"
          [size]="$any(value('size'))"
          [weight]="$any(value('weight'))"
          [tone]="$any(value('tone'))"
          [family]="$any(value('family'))"
          [lineHeight]="$any(value('lineHeight'))"
          [fontStyle]="$any(value('fontStyle'))"
          [decoration]="$any(value('decoration'))"
          [align]="$any(value('align'))"
          [wrap]="$any(value('wrap'))"
          [overflow]="$any(value('overflow'))"
          [lineClamp]="$any(value('lineClamp'))"
          [direction]="$any(value('direction'))"
          [selectable]="$any(value('selectable'))"
          [href]="$any(value('href'))"
          [target]="$any(value('target'))"
          [rel]="$any(value('rel'))"
          [download]="$any(value('download'))"
          [for]="$any(value('forId'))"
          [datetime]="$any(value('datetime'))"
          [value]="$any(value('value'))"
          [title]="$any(value('title'))"
          [cite]="$any(value('cite'))"
        >تقرير حركة المخزون للفترة الحالية — Inventory Q4 / 2026 — مراجعة الطلبات وأرصدة الفروع</erp-text>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
