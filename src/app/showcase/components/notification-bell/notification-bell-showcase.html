<erp-stack gap="default" data-dedicated-showcase="notification-bell" data-showcase-sections="1">
  <erp-text type="heading-2">جرس الإشعارات</erp-text>
  <erp-text type="paragraph" tone="secondary">مدخل إشعارات قابل للفتح مع عدد غير المقروء.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-notification-bell
          data-showcase-target
          [notifications]="$any(value('notifications'))"
          [unreadCount]="$any(value('unreadCount'))"
          [label]="$any(value('label'))"
          [open]="$any(value('open'))"
          (openChange)="recordModel('open', $event)"
          (notificationActivated)="recordEvent('notificationActivated', $event)"
          (markAllReadRequested)="recordEvent('markAllReadRequested', $event)"
        ></erp-notification-bell>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
