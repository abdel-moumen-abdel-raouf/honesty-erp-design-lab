<erp-stack gap="default" data-dedicated-showcase="bulk-action-bar" data-showcase-sections="1">
  <erp-text type="heading-2">شريط الإجراءات الجماعية</erp-text>
  <erp-text type="paragraph" tone="secondary">إجراءات مرتبطة بالصفوف المحددة.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-bulk-action-bar
          (clearSelection)="recordEvent('clearSelection', $event)"
        ></erp-bulk-action-bar>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
