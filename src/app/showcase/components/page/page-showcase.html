<erp-stack gap="default" data-dedicated-showcase="page" data-showcase-sections="1">
  <erp-text type="heading-2">الصفحة</erp-text>
  <erp-text type="paragraph" tone="secondary">حد عرض وتمرير واستجابة لمحتوى صفحة واحدة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-page
          data-showcase-target
          [widthMode]="$any(value('widthMode'))"
          [scrollMode]="$any(value('scrollMode'))"
        ><erp-stack gap="default"><erp-surface padding="default" border="subtle"><erp-stack gap="tight"><erp-text type="strong">ملخص المبيعات</erp-text><erp-text type="paragraph" tone="secondary">متابعة أوامر البيع والفواتير المفتوحة للفترة الحالية.</erp-text></erp-stack></erp-surface><erp-surface padding="default" border="subtle"><erp-stack gap="tight"><erp-text type="strong">تنبيهات المخزون</erp-text><erp-text type="paragraph" tone="secondary">ثمانية أصناف وصلت إلى حد إعادة الطلب.</erp-text></erp-stack></erp-surface></erp-stack></erp-page>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
