<erp-stack gap="default" data-dedicated-showcase="table-toolbar" data-showcase-sections="1">
  <erp-text type="heading-2">شريط أدوات الجدول</erp-text>
  <erp-text type="paragraph" tone="secondary">تخطيط البحث والإجراءات وأدوات العرض للجدول.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-table-toolbar
          data-showcase-target
          [presentation]="$any(value('presentation'))"
          [label]="$any(value('label'))"
          [showRefresh]="$any(value('showRefresh'))"
          [showExport]="$any(value('showExport'))"
          [refreshing]="$any(value('refreshing'))"
          [disabled]="$any(value('disabled'))"
          (refreshRequested)="recordEvent('refreshRequested', $event)"
          (exportRequested)="recordEvent('exportRequested', $event)"
        ><erp-search-box erpTableToolbarSearch label="بحث الجدول" labelMode="visually-hidden" mode="inline" placeholder="اسم العميل أو الكود" /><erp-filter-drawer erpTableToolbarFilters [definitions]="tableFilterDefinitions" [filters]="tableFilters" (applied)="recordEvent('projectedFiltersApplied', $event)" /><erp-column-chooser erpTableToolbarColumns presentation="table-reference" [columns]="tableColumns" [visibleKeys]="tableVisibleKeys" (visibilityChange)="recordEvent('projectedColumnsChanged', $event)" /><erp-button erpTableToolbarActions label="إضافة عميل" icon="add" size="sm" (pressed)="recordEvent('toolbarActionPressed', true)" /></erp-table-toolbar>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
