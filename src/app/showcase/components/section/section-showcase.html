<erp-stack gap="default" data-dedicated-showcase="section" data-showcase-sections="1">
  <erp-text type="heading-2">القسم</erp-text>
  <erp-text type="paragraph" tone="secondary">حد section دلالي وفجوة داخلية.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-section
          data-showcase-target
          [gap]="$any(value('gap'))"
        ><erp-surface padding="tight" border="subtle"><erp-text type="paragraph">عنوان القسم</erp-text></erp-surface><erp-surface padding="tight" border="subtle"><erp-text type="paragraph">محتوى القسم</erp-text></erp-surface><erp-surface padding="tight" border="subtle"><erp-text type="paragraph">إجراءات القسم</erp-text></erp-surface></erp-section>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
