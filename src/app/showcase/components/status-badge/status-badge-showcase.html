<erp-stack gap="default" data-dedicated-showcase="status-badge" data-showcase-sections="1">
  <erp-text type="heading-2">شارة الحالة</erp-text>
  <erp-text type="paragraph" tone="secondary">مؤشر حالة غير تفاعلي أو تفاعلي حسب العقد.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/status-badge/ERP_STATUS_BADGE_REFERENCE_EXACT_V1.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-status-badge
          data-showcase-target
          [label]="$any(value('label'))"
          [tone]="$any(value('tone'))"
          [variant]="$any(value('variant'))"
          [size]="$any(value('size'))"
          [shape]="$any(value('shape'))"
          [widthMode]="$any(value('widthMode'))"
          [icon]="$any(value('icon'))"
          [image]="$any(value('image'))"
          [count]="$any(value('count'))"
          [showDot]="$any(value('showDot'))"
          [pulse]="$any(value('pulse'))"
          [uppercase]="$any(value('uppercase'))"
          [interactive]="$any(value('interactive'))"
          [selected]="$any(value('selected'))"
          [removable]="$any(value('removable'))"
          [disabled]="$any(value('disabled'))"
          (badgeClick)="recordEvent('badgeClick', $event)"
          (selectedChange)="recordEvent('selectedChange', $event)"
          (remove)="recordEvent('remove', $event)"
        ></erp-status-badge>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
