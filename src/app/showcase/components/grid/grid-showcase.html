<erp-stack gap="default" data-dedicated-showcase="grid" data-showcase-sections="1">
  <erp-text type="heading-2">الشبكة</erp-text>
  <erp-text type="paragraph" tone="secondary">تخطيط شبكي بأعمدة وفجوات مضبوطة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-grid
          data-showcase-target
          [columns]="$any(value('columns'))"
          [gap]="$any(value('gap'))"
          [responsive]="$any(value('responsive'))"
        ><erp-surface padding="default" border="subtle"><erp-text type="paragraph">عنصر مرئي 1</erp-text></erp-surface><erp-surface padding="default" border="subtle"><erp-text type="paragraph">عنصر مرئي 2</erp-text></erp-surface><erp-surface padding="default" border="subtle"><erp-text type="paragraph">عنصر مرئي 3</erp-text></erp-surface></erp-grid>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
