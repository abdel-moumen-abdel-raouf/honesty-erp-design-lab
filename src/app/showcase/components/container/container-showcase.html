<erp-stack gap="default" data-dedicated-showcase="container" data-showcase-sections="1">
  <erp-text type="heading-2">الحاوية</erp-text>
  <erp-text type="paragraph" tone="secondary">حد عرض أفقي للمحتوى.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-container
          data-showcase-target
          [width]="$any(value('width'))"
          [gutter]="$any(value('gutter'))"
        ><erp-text type="paragraph">محتوى مسقط مرئي داخل المكوّن</erp-text></erp-container>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
