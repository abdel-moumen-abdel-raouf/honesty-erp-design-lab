<erp-stack gap="default" data-dedicated-showcase="alert" data-showcase-sections="1">
  <erp-text type="heading-2">تنبيه</erp-text>
  <erp-text type="paragraph" tone="secondary">رسالة ملاحظات قابلة للإغلاق عند السماح بذلك.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-alert
          data-showcase-target
          [title]="$any(value('title'))"
          [description]="$any(value('description'))"
          [tone]="$any(value('tone'))"
          [icon]="$any(value('icon'))"
          [dismissible]="$any(value('dismissible'))"
          [dismissLabel]="$any(value('dismissLabel'))"
          (dismissed)="recordEvent('dismissed', $event)"
        ></erp-alert>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
