<erp-stack gap="default" data-dedicated-showcase="entity-schema-fields" data-showcase-sections="1">
  <erp-text type="heading-2">حقول مخطط الكيان</erp-text>
  <erp-text type="paragraph" tone="secondary">عرض حقول المخطط من خلال مدخلات ERP المعتمدة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-entity-schema-fields
          data-showcase-target
          [fields]="$any(value('fields'))"
          [values]="$any(value('values'))"
          [section]="$any(value('section'))"
          [issues]="$any(value('issues'))"
          [customFieldOutlets]="$any(value('customFieldOutlets'))"
          (fieldValueChanged)="recordEvent('fieldValueChanged', $event)"
        ></erp-entity-schema-fields>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
