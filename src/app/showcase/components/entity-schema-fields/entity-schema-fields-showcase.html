<erp-stack gap="default" data-dedicated-showcase="entity-schema-fields" data-showcase-sections="1">
  <erp-text type="heading-2">حقول مخطط الكيان</erp-text>
  <erp-text type="paragraph" tone="secondary">عرض حقول المخطط من خلال مدخلات ERP المعتمدة.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-entity-schema-fields
          [fields]="$any(cases[0].inputs['fields'])"
          [values]="$any(cases[0].inputs['values'])"
          (fieldValueChanged)="recordEvent('fieldValueChanged', $event)"
        ></erp-entity-schema-fields>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
