<erp-stack gap="default" data-dedicated-showcase="table" data-showcase-sections="1">
  <erp-text type="heading-2">الجدول</erp-text>
  <erp-text type="paragraph" tone="secondary">دلالات الجدول والصفوف والخلايا والاختيار والفرز والتحجيم.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/table/ERP_TABLE_REFERENCE_FULL_EXPERIENCE_V2.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-table
          data-showcase-target
          [caption]="$any(value('caption'))"
          [columns]="$any(value('columns'))"
          [visibleColumnKeys]="$any(value('visibleColumnKeys'))"
          [rows]="$any(value('rows'))"
          [rowKey]="$any(value('rowKey'))"
          [emptyText]="$any(value('emptyText'))"
          [compact]="$any(value('compact'))"
          [density]="$any(value('density'))"
          [layout]="$any(value('layout'))"
          [presentation]="$any(value('presentation'))"
          [fixedHeight]="$any(value('fixedHeight'))"
          [selectable]="$any(value('selectable'))"
          [showHeaderSelection]="$any(value('showHeaderSelection'))"
          [rowActivatable]="$any(value('rowActivatable'))"
          [striped]="$any(value('striped'))"
          [hover]="$any(value('hover'))"
          [hoverMotion]="$any(value('hoverMotion'))"
          [sort]="$any(value('sort'))"
          [footerValues]="$any(value('footerValues'))"
          [cellDefinitions]="$any(value('cellDefinitions'))"
          [footerDefinitions]="$any(value('footerDefinitions'))"
          [selectedKeys]="$any(value('selectedKeys'))"
          (selectedKeysChange)="recordModel('selectedKeys', $event)"
          [columnWidths]="$any(value('columnWidths'))"
          (columnWidthsChange)="recordModel('columnWidths', $event)"
          (rowActivated)="recordEvent('rowActivated', $event)"
          (sortChange)="recordEvent('sortChange', $event)"
          (columnWidthChange)="recordEvent('columnWidthChange', $event)"
        ></erp-table>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
