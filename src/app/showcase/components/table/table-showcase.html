<erp-stack gap="default" data-dedicated-showcase="table" data-showcase-sections="6">
  <erp-text type="heading-2">الجدول</erp-text>
  <erp-text type="paragraph" tone="secondary">دلالات الجدول والصفوف والخلايا والاختيار والفرز والتحجيم.</erp-text>
  <erp-text type="heading-2">مرجع Product Owner الدقيق</erp-text>
  <app-review-exact-core-showcase [focus]="'table'" />
  <erp-text type="heading-2">واجهة API والتوافق</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-table
          [caption]="$any(cases[0].inputs['caption'])"
          [columns]="$any(cases[0].inputs['columns'])"
          [rows]="$any(cases[0].inputs['rows'])"
          [selectedKeys]="$any(modelValue('default:selectedKeys', cases[0].inputs['selectedKeys']))"
          (selectedKeysChange)="recordModel('default:selectedKeys', $event)"
          [columnWidths]="$any(modelValue('default:columnWidths', cases[0].inputs['columnWidths']))"
          (columnWidthsChange)="recordModel('default:columnWidths', $event)"
          (rowActivated)="recordEvent('rowActivated', $event)"
          (sortChange)="recordEvent('sortChange', $event)"
          (columnWidthChange)="recordEvent('columnWidthChange', $event)"
        ></erp-table>
      </erp-stack>
    </erp-surface>

    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
