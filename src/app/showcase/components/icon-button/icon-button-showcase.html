<erp-stack gap="default" data-dedicated-showcase="icon-button" data-showcase-sections="1">
  <erp-text type="heading-2">زر أيقونة</erp-text>
  <erp-text type="paragraph" tone="secondary">إجراء مختصر بأيقونة وتسمية وصول.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-tooltip [text]="$any(value('label'))"><erp-icon-button
          data-showcase-target
          [icon]="$any(value('icon'))"
          [label]="$any(value('label'))"
          [variant]="$any(value('variant'))"
          [tone]="$any(value('tone'))"
          [size]="$any(value('size'))"
          [shape]="$any(value('shape'))"
          [borderStyle]="$any(value('borderStyle'))"
          [type]="$any(value('type'))"
          [name]="$any(value('name'))"
          [value]="$any(value('value'))"
          [form]="$any(value('form'))"
          [ariaHasPopup]="$any(value('ariaHasPopup'))"
          [ariaControls]="$any(value('ariaControls'))"
          [ariaExpanded]="$any(value('ariaExpanded'))"
          [role]="$any(value('role'))"
          [disabled]="$any(value('disabled'))"
          [loading]="$any(value('loading'))"
          [cursor]="$any(value('cursor'))"
          [rippleSpeed]="$any(value('rippleSpeed'))"
          [presentation]="$any(value('presentation'))"
          (pressed)="recordEvent('pressed', $event)"
        ></erp-icon-button></erp-tooltip>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
