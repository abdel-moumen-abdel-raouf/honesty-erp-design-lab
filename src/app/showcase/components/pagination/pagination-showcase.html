<erp-stack gap="default" data-dedicated-showcase="pagination" data-showcase-sections="1">
  <erp-text type="heading-2">ترقيم الصفحات</erp-text>
  <erp-text type="paragraph" tone="secondary">تنقل مضبوط بين الصفحات وحجم الصفحة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-pagination
          data-showcase-target
          [page]="$any(value('page'))"
          [pageCount]="$any(value('pageCount'))"
          [totalItems]="$any(value('totalItems'))"
          [pageSize]="$any(value('pageSize'))"
          [pageSizeOptions]="$any(value('pageSizeOptions'))"
          [presentation]="$any(value('presentation'))"
          [visibleItems]="$any(value('visibleItems'))"
          [selectedItems]="$any(value('selectedItems'))"
          [showSummary]="$any(value('showSummary'))"
          [showPageSize]="$any(value('showPageSize'))"
          [showFirst]="$any(value('showFirst'))"
          [showPrevious]="$any(value('showPrevious'))"
          [showPageNumbers]="$any(value('showPageNumbers'))"
          [showNext]="$any(value('showNext'))"
          [showLast]="$any(value('showLast'))"
          (pageChange)="recordEvent('pageChange', $event)"
          (pageSizeChange)="recordEvent('pageSizeChange', $event)"
        ></erp-pagination>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
