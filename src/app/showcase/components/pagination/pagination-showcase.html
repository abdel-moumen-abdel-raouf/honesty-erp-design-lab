<erp-stack gap="default" data-dedicated-showcase="pagination" data-showcase-sections="1">
  <erp-text type="heading-2">ترقيم الصفحات</erp-text>
  <erp-text type="paragraph" tone="secondary">تنقل مضبوط بين الصفحات وحجم الصفحة.</erp-text>
  <erp-text type="heading-2">مرجع Product Owner الدقيق</erp-text>
  <app-review-exact-core-showcase [focus]="'pagination'" />
  <erp-text type="heading-2">واجهة API والتوافق</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-pagination
          [pageCount]="$any(cases[0].inputs['pageCount'])"
          (pageChange)="recordEvent('pageChange', $event)"
          (pageSizeChange)="recordEvent('pageSizeChange', $event)"
        ></erp-pagination>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
