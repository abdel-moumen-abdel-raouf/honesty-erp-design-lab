<erp-stack gap="default" data-dedicated-showcase="global-search" data-showcase-sections="1">
  <erp-text type="heading-2">البحث العام</erp-text>
  <erp-text type="paragraph" tone="secondary">بحث عام داخل إطار التطبيق مع نتائج مصنفة.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/global-search/ERP_GLOBAL_SEARCH_REFERENCE_V1.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-global-search
          data-showcase-target
          [results]="$any(value('results'))"
          [label]="$any(value('label'))"
          [placeholder]="$any(value('placeholder'))"
          [mode]="$any(value('mode'))"
          [query]="$any(value('query'))"
          (queryChange)="recordModel('query', $event)"
          (resultActivated)="recordEvent('resultActivated', $event)"
        ></erp-global-search>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
