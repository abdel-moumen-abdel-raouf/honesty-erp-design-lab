<erp-stack gap="default" data-dedicated-showcase="fab-menu" data-showcase-sections="1">
  <erp-text type="heading-2">قائمة إجراءات عائمة</erp-text>
  <erp-text type="paragraph" tone="secondary">مجموعة إجراءات عائمة قابلة للفتح والإغلاق.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview showcase-live-preview--floating">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-fab-menu
          data-showcase-target
          [label]="$any(value('label'))"
          [icon]="$any(value('icon'))"
          [items]="$any(value('items'))"
          [placement]="$any(value('placement'))"
          [disabled]="$any(value('disabled'))"
          (itemSelected)="recordEvent('itemSelected', $event)"
          [style.position]="'absolute'"
          [style.inset-inline-start.%]="previewInline()"
          [style.inset-block-start.%]="previewBlock()"
          [style.transform]="'translate(-50%, -50%)'"
        ></erp-fab-menu>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
