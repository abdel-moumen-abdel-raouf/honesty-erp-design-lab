<erp-stack gap="default" data-dedicated-showcase="user-menu" data-showcase-sections="3">
  <erp-text type="heading-2">قائمة المستخدم</erp-text>
  <erp-text type="paragraph" tone="secondary">هوية المستخدم وإجراءات الحساب ضمن سطح مثبت.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-user-menu
          [user]="$any(cases[0].inputs['user'])"
          [open]="$any(modelValue('default:open', cases[0].inputs['open']))"
          (openChange)="recordModel('default:open', $event)"
          (actionActivated)="recordEvent('actionActivated', $event)"
        ></erp-user-menu>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="open-false">
      <erp-stack gap="tight">
        <erp-text type="heading-3">open: false</erp-text>
        <erp-user-menu
          [user]="$any(cases[1].inputs['user'])"
          [open]="$any(modelValue('open-false:open', cases[1].inputs['open']))"
          (openChange)="recordModel('open-false:open', $event)"
          (actionActivated)="recordEvent('actionActivated', $event)"
        ></erp-user-menu>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="open-true">
      <erp-stack gap="tight">
        <erp-text type="heading-3">open: true</erp-text>
        <erp-user-menu
          [user]="$any(cases[2].inputs['user'])"
          [open]="$any(modelValue('open-true:open', cases[2].inputs['open']))"
          (openChange)="recordModel('open-true:open', $event)"
          (actionActivated)="recordEvent('actionActivated', $event)"
        ></erp-user-menu>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
