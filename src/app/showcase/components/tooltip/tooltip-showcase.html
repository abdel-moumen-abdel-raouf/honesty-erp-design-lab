<erp-stack gap="default" data-dedicated-showcase="tooltip" data-showcase-sections="1">
  <erp-text type="heading-2">تلميح</erp-text>
  <erp-text type="paragraph" tone="secondary">شرح مثبت على محفز مرئي مع مواضع وسلوك فتح متعددة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-tooltip
          data-showcase-target
          [text]="$any(value('text'))"
          [variant]="$any(value('variant'))"
          [interactive]="$any(value('interactive'))"
          [placement]="$any(value('placement'))"
          [activation]="$any(value('activation'))"
          [showArrow]="$any(value('showArrow'))"
          [disabled]="$any(value('disabled'))"
          [enterAnimation]="$any(value('enterAnimation'))"
          [exitAnimation]="$any(value('exitAnimation'))"
          [open]="$any(value('open'))"
          (openChange)="recordModel('open', $event)"
        ><erp-button label="اعرض التلميح" variant="outline" /></erp-tooltip>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
