<erp-stack gap="default" data-dedicated-showcase="radio-group" data-showcase-sections="1">
  <erp-text type="heading-2">مجموعة الاختيار</erp-text>
  <erp-text type="paragraph" tone="secondary">مجموعة خيارات أحادية مضبوطة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-radio-group
          data-showcase-target
          [label]="$any(value('label'))"
          [name]="$any(value('name'))"
          [form]="$any(value('form'))"
          [required]="$any(value('required'))"
          [externalValidationIssues]="$any(value('externalValidationIssues'))"
          [options]="$any(value('options'))"
          [mode]="$any(value('mode'))"
          [variant]="$any(value('variant'))"
          [tone]="$any(value('tone'))"
          [status]="$any(value('status'))"
          [size]="$any(value('size'))"
          [readOnly]="$any(value('readOnly'))"
          [formControl]="control"
          data-showcase-cva-disabled-control
        ></erp-radio-group>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
      <erp-text type="caption" selectable>القيمة الحالية: {{ cvaValue() }}</erp-text>
    </erp-stack>
  </erp-surface>
  <erp-surface padding="default" border="subtle" data-radio-reference-section>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل الحالات المرجعية</erp-text>
      <erp-text type="paragraph" tone="secondary">
        التكوين العادي وTile متاحان عند الطلب مع استمرار هدف حي واحد.
      </erp-text>
      <erp-button
        data-radio-reference-toggle
        [label]="referenceExpanded() ? 'إخفاء الدليل' : 'عرض الدليل'"
        (pressed)="toggleReference()"
      />
      @if (referenceExpanded()) {
        <app-review-radio-reference focus="radio-group" />
      }
    </erp-stack>
  </erp-surface>
</erp-stack>
