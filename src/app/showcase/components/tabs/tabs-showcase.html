<erp-stack gap="default" data-dedicated-showcase="tabs" data-showcase-sections="1">
  <erp-text type="heading-2">علامات التبويب</erp-text>
  <erp-text type="paragraph" tone="secondary">تبديل دلالي بين رؤوس ولوحات محتوى.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/tabs/ERP_TABS_REFERENCE_EXACT_V1.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-tabs
          data-showcase-target
          [items]="$any(value('items'))"
          [orientation]="$any(value('orientation'))"
          [verticalPlacement]="$any(value('verticalPlacement'))"
          [distribution]="$any(value('distribution'))"
          [variant]="$any(value('variant'))"
          [transition]="$any(value('transition'))"
          [headerPresentation]="$any(value('headerPresentation'))"
          [headerShape]="$any(value('headerShape'))"
          [renderPanels]="$any(value('renderPanels'))"
          [lazy]="$any(value('lazy'))"
          [keepAlive]="$any(value('keepAlive'))"
          [activeId]="$any(value('activeId'))"
          (activeIdChange)="recordModel('activeId', $event)"
          (changed)="recordEvent('changed', $event)"
          (tabClick)="recordEvent('tabClick', $event)"
        ></erp-tabs>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-exact-reference focus="tabs" />
</erp-stack>
