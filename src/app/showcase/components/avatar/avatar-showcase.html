<erp-stack gap="default" data-dedicated-showcase="avatar" data-showcase-sections="1">
  <erp-text type="heading-2">الصورة الرمزية</erp-text>
  <erp-text type="paragraph" tone="secondary">هوية بصرية بصورة أو أحرف أو أيقونة وحضور.</erp-text>
  <erp-text class="showcase-reference" type="caption" tone="secondary" selectable>مرجع Product Owner: src/app/controls/avatar/ERP_AVATAR_REFERENCE_EXACT_V1.md</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-avatar
          data-showcase-target
          [name]="$any(value('name'))"
          [src]="$any(value('src'))"
          [initials]="$any(value('initials'))"
          [alt]="$any(value('alt'))"
          [size]="$any(value('size'))"
          [shape]="$any(value('shape'))"
          [tone]="$any(value('tone'))"
          [fallbackIcon]="$any(value('fallbackIcon'))"
          [ring]="$any(value('ring'))"
          [bordered]="$any(value('bordered'))"
          [loading]="$any(value('loading'))"
          [interactive]="$any(value('interactive'))"
          [presence]="$any(value('presence'))"
          [presencePosition]="$any(value('presencePosition'))"
          [presenceMotion]="$any(value('presenceMotion'))"
          [hoverMotion]="$any(value('hoverMotion'))"
          [cursor]="$any(value('cursor'))"
          [presentation]="$any(value('presentation'))"
          (avatarClick)="recordEvent('avatarClick', $event)"
        ></erp-avatar>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-exact-reference focus="avatar" />
</erp-stack>
