<erp-stack gap="default" data-dedicated-showcase="surface" data-showcase-sections="1">
  <erp-text type="heading-2">السطح</erp-text>
  <erp-text type="paragraph" tone="secondary">سطح مرئي يملك الحشو والحدود والارتفاع.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-surface
          data-showcase-target
          [tone]="$any(value('tone'))"
          [border]="$any(value('border'))"
          [elevation]="$any(value('elevation'))"
          [radius]="$any(value('radius'))"
          [padding]="$any(value('padding'))"
        ><erp-text type="paragraph">محتوى مسقط مرئي داخل المكوّن</erp-text></erp-surface>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
