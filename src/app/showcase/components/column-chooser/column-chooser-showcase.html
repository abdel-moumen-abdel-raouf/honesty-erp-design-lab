<erp-stack gap="default" data-dedicated-showcase="column-chooser" data-showcase-sections="1">
  <erp-text type="heading-2">محدد الأعمدة</erp-text>
  <erp-text type="paragraph" tone="secondary">ضبط الأعمدة المرئية للجدول.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-column-chooser
          data-showcase-target
          [columns]="$any(value('columns'))"
          [visibleKeys]="$any(value('visibleKeys'))"
          [disabled]="$any(value('disabled'))"
          [presentation]="$any(value('presentation'))"
          (visibilityChange)="recordEvent('visibilityChange', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ></erp-column-chooser>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
