<erp-stack gap="default" data-dedicated-showcase="column-chooser" data-showcase-sections="4">
  <erp-text type="heading-2">محدد الأعمدة</erp-text>
  <erp-text type="paragraph" tone="secondary">ضبط الأعمدة المرئية للجدول.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-column-chooser
          [columns]="$any(cases[0].inputs['columns'])"
          (visibilityChange)="recordEvent('visibilityChange', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ></erp-column-chooser>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="disabled-false">
      <erp-stack gap="tight">
        <erp-text type="heading-3">disabled: false</erp-text>
        <erp-column-chooser
          [columns]="$any(cases[1].inputs['columns'])"
          [disabled]="$any(cases[1].inputs['disabled'])"
          (visibilityChange)="recordEvent('visibilityChange', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ></erp-column-chooser>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="disabled-true">
      <erp-stack gap="tight">
        <erp-text type="heading-3">disabled: true</erp-text>
        <erp-column-chooser
          [columns]="$any(cases[2].inputs['columns'])"
          [disabled]="$any(cases[2].inputs['disabled'])"
          (visibilityChange)="recordEvent('visibilityChange', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ></erp-column-chooser>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="disabled">
      <erp-stack gap="tight">
        <erp-text type="heading-3">حالة معطلة</erp-text>
        <erp-column-chooser
          [columns]="$any(cases[3].inputs['columns'])"
          [disabled]="$any(cases[3].inputs['disabled'])"
          (visibilityChange)="recordEvent('visibilityChange', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
        ></erp-column-chooser>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
