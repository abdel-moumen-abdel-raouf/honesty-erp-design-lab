<erp-stack gap="default" data-dedicated-showcase="button-group" data-showcase-sections="1">
  <erp-text type="heading-2">مجموعة أزرار</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار إجراء واحد من مجموعة مترابطة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-button-group
          data-showcase-target
          [items]="$any(value('items'))"
          [orientation]="$any(value('orientation'))"
          [attached]="$any(value('attached'))"
          (itemPressed)="recordEvent('itemPressed', $event)"
        ></erp-button-group>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
