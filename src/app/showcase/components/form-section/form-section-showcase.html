<erp-stack gap="default" data-dedicated-showcase="form-section" data-showcase-sections="1">
  <erp-text type="heading-2">قسم النموذج</erp-text>
  <erp-text type="paragraph" tone="secondary">تجميع دلالي لحقول النموذج مع عنوان وإجراءات.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-form-section
          data-showcase-target
          [title]="$any(value('title'))"
          [description]="$any(value('description'))"
          [compact]="$any(value('compact'))"
        ><erp-button erpFormSectionActions label="إجراء القسم" variant="outline" /><erp-text-box label="اسم الحساب" /></erp-form-section>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
