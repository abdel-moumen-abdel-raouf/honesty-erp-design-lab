<erp-stack gap="default" data-dedicated-showcase="filter-drawer" data-showcase-sections="1">
  <erp-text type="heading-2">درج التصفية</erp-text>
  <erp-text type="paragraph" tone="secondary">سطح حاجب لتكوين المرشحات وتطبيقها.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-filter-drawer
          data-showcase-target
          [definitions]="$any(value('definitions'))"
          [filters]="$any(value('filters'))"
          [disabled]="$any(value('disabled'))"
          (applied)="recordEvent('applied', $event)"
        ></erp-filter-drawer>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
