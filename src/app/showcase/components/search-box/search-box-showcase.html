<erp-stack gap="default" data-dedicated-showcase="search-box" data-showcase-sections="4">
  <erp-text type="heading-2">صندوق البحث</erp-text>
  <erp-text type="paragraph" tone="secondary">تحرير استعلام وعرض نتائج inline أو popup.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-search-box
          [label]="$any(cases[0].inputs['label'])"
          [formControl]="control"
        ></erp-search-box>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="mode-modal">
      <erp-stack gap="tight">
        <erp-text type="heading-3">mode: modal</erp-text>
        <erp-search-box
          [label]="$any(cases[1].inputs['label'])"
          [mode]="$any(cases[1].inputs['mode'])"
          [formControl]="control"
        ></erp-search-box>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="mode-dropdown">
      <erp-stack gap="tight">
        <erp-text type="heading-3">mode: dropdown</erp-text>
        <erp-search-box
          [label]="$any(cases[2].inputs['label'])"
          [mode]="$any(cases[2].inputs['mode'])"
          [formControl]="control"
        ></erp-search-box>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="mode-inline">
      <erp-stack gap="tight">
        <erp-text type="heading-3">mode: inline</erp-text>
        <erp-search-box
          [label]="$any(cases[3].inputs['label'])"
          [mode]="$any(cases[3].inputs['mode'])"
          [formControl]="control"
        ></erp-search-box>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
      <erp-text type="caption" selectable>القيمة الحالية: {{ control.value }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
