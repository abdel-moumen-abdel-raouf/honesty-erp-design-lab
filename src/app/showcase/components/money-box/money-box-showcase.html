<erp-stack gap="default" data-dedicated-showcase="money-box" data-showcase-sections="1">
  <erp-text type="heading-2">حقل المال</erp-text>
  <erp-text type="paragraph" tone="secondary">تحرير قيمة مالية وعملة وفق التفضيلات.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-money-box
          data-showcase-target
          [label]="$any(value('label'))"
          [name]="$any(value('name'))"
          [form]="$any(value('form'))"
          [required]="$any(value('required'))"
          [externalValidationIssues]="$any(value('externalValidationIssues'))"
          [tone]="$any(value('tone'))"
          [status]="$any(value('status'))"
          [variant]="$any(value('variant'))"
          [borderMode]="$any(value('borderMode'))"
          [shape]="$any(value('shape'))"
          [size]="$any(value('size'))"
          [appearance]="$any(value('appearance'))"
          [labelMode]="$any(value('labelMode'))"
          [floatingPosition]="$any(value('floatingPosition'))"
          [helperText]="$any(value('helperText'))"
          [helperPosition]="$any(value('helperPosition'))"
          [leadingIcon]="$any(value('leadingIcon'))"
          [trailingIcon]="$any(value('trailingIcon'))"
          [clearable]="$any(value('clearable'))"
          [feedbackText]="$any(value('feedbackText'))"
          [feedbackDismissible]="$any(value('feedbackDismissible'))"
          [currency]="$any(value('currency'))"
          [locale]="$any(value('locale'))"
          [min]="$any(value('min'))"
          [max]="$any(value('max'))"
          [step]="$any(value('step'))"
          [minimumFractionDigits]="$any(value('minimumFractionDigits'))"
          [maximumFractionDigits]="$any(value('maximumFractionDigits'))"
          [placeholder]="$any(value('placeholder'))"
          [readonly]="$any(value('readonly'))"
          [allowEmpty]="$any(value('allowEmpty'))"
          [pattern]="$any(value('pattern'))"
          [digitSet]="$any(value('digitSet'))"
          [formControl]="control"
          data-showcase-cva-disabled-control
        ></erp-money-box>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
      <erp-text type="caption" selectable>القيمة الحالية: {{ cvaValue() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
