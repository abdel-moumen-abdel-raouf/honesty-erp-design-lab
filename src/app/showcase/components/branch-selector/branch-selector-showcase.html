<erp-stack gap="default" data-dedicated-showcase="branch-selector" data-showcase-sections="1">
  <erp-text type="heading-2">محدد الفرع</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار فرع مضبوط يتحكم فيه المستهلك.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-branch-selector
          data-showcase-target
          [branches]="$any(value('branches'))"
          [label]="$any(value('label'))"
          [placeholder]="$any(value('placeholder'))"
          [disabled]="$any(value('disabled'))"
          [value]="$any(value('value'))"
          (valueChange)="recordModel('value', $event)"
          (changed)="recordEvent('changed', $event)"
        ></erp-branch-selector>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
