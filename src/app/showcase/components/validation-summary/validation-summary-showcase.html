<erp-stack gap="default" data-dedicated-showcase="validation-summary" data-showcase-sections="1">
  <erp-text type="heading-2">ملخص التحقق</erp-text>
  <erp-text type="paragraph" tone="secondary">عرض مشكلات التحقق المشتركة ونية تنشيط الحقل.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-validation-summary
          (issueActivated)="recordEvent('issueActivated', $event)"
        ></erp-validation-summary>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
