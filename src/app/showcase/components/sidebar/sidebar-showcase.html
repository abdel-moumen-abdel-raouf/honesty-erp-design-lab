<erp-stack gap="default" data-dedicated-showcase="sidebar" data-showcase-sections="1">
  <erp-text type="heading-2">الشريط الجانبي</erp-text>
  <erp-text type="paragraph" tone="secondary">تنقل هرمي مضبوط بعناصر يقدمها المستهلك.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-sidebar
          data-showcase-target
          [items]="$any(value('items'))"
          [activeId]="$any(value('activeId'))"
          [label]="$any(value('label'))"
          [collapseLabel]="$any(value('collapseLabel'))"
          [collapsed]="$any(value('collapsed'))"
          (collapsedChange)="recordModel('collapsed', $event)"
          [expandedIds]="$any(value('expandedIds'))"
          (expandedIdsChange)="recordModel('expandedIds', $event)"
          (navigationActivated)="recordEvent('navigationActivated', $event)"
        ></erp-sidebar>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
