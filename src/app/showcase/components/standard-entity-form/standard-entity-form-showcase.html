<erp-stack gap="default" data-dedicated-showcase="standard-entity-form" data-showcase-sections="1">
  <erp-text type="heading-2">نموذج الكيان القياسي</erp-text>
  <erp-text type="paragraph" tone="secondary">تكوين CRUD محدود بمخطط وقيم مضبوطة.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-standard-entity-form
          data-showcase-target
          [schema]="$any(value('schema'))"
          [values]="$any(value('values'))"
          [issues]="$any(value('issues'))"
          [disabled]="$any(value('disabled'))"
          [busy]="$any(value('busy'))"
          [activeStepId]="$any(value('activeStepId'))"
          (activeStepIdChange)="recordModel('activeStepId', $event)"
          (valueChanged)="recordEvent('valueChanged', $event)"
          (submitRequested)="recordEvent('submitRequested', $event)"
          (resetRequested)="recordEvent('resetRequested', $event)"
          (cancelRequested)="recordEvent('cancelRequested', $event)"
          (issueActivated)="recordEvent('issueActivated', $event)"
        ></erp-standard-entity-form>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
