<erp-stack gap="default" data-dedicated-showcase="color-picker" data-showcase-sections="3">
  <erp-text type="heading-2">منتقي اللون</erp-text>
  <erp-text type="paragraph" tone="secondary">اختيار لون من سجل ألوان النظام.</erp-text>
    <erp-surface padding="default" border="subtle" data-showcase-case="default">
      <erp-stack gap="tight">
        <erp-text type="heading-3">الحالة الافتراضية</erp-text>
        <erp-color-picker
          [label]="$any(cases[0].inputs['label'])"
          [formControl]="control"
        ></erp-color-picker>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="mode-system">
      <erp-stack gap="tight">
        <erp-text type="heading-3">mode: system</erp-text>
        <erp-color-picker
          [label]="$any(cases[1].inputs['label'])"
          [mode]="$any(cases[1].inputs['mode'])"
          [formControl]="control"
        ></erp-color-picker>
      </erp-stack>
    </erp-surface>
    <erp-surface padding="default" border="subtle" data-showcase-case="mode-free">
      <erp-stack gap="tight">
        <erp-text type="heading-3">mode: free</erp-text>
        <erp-color-picker
          [label]="$any(cases[2].inputs['label'])"
          [mode]="$any(cases[2].inputs['mode'])"
          [formControl]="control"
        ></erp-color-picker>
      </erp-stack>
    </erp-surface>
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">دليل التفاعل والحالة المضبوطة</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
      <erp-text type="caption" selectable>القيمة الحالية: {{ control.value }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
