<erp-stack gap="default" data-dedicated-showcase="stepper" data-showcase-sections="1">
  <erp-text type="heading-2">الخطوات</erp-text>
  <erp-text type="paragraph" tone="secondary">تنقل مضبوط بين خطوات ومحتوى مسمى.</erp-text>
  <erp-surface padding="default" border="subtle" data-showcase-case="live" class="showcase-live-preview">
    <erp-stack gap="tight">
      <erp-text type="heading-3">المعاينة الحية</erp-text>
      <erp-stepper
          data-showcase-target
          [steps]="$any(value('steps'))"
          [activeId]="$any(value('activeId'))"
          (activeIdChange)="recordModel('activeId', $event)"
          (changed)="recordEvent('changed', $event)"
        ><ng-template erpStepPanel="identity"><erp-text type="paragraph">بيانات هوية العميل ومعلومات التواصل المعتمدة.</erp-text></ng-template><ng-template erpStepPanel="account"><erp-text type="paragraph">إعداد شروط الحساب والحد الائتماني للعميل.</erp-text></ng-template><ng-template erpStepPanel="documents"><erp-text type="paragraph">إرفاق المستندات الداعمة قبل إرسال السجل للاعتماد.</erp-text></ng-template><ng-template erpStepPanel="approval"><erp-text type="paragraph">مراجعة السجل واعتماده بعد اكتمال البيانات.</erp-text></ng-template></erp-stepper>
    </erp-stack>
  </erp-surface>
  <app-review-showcase-control-panel
    [controls]="controls"
    [values]="controlValues()"
    (controlChanged)="applyControl($event)"
  />
  <erp-surface padding="default" border="subtle" data-showcase-event-log>
    <erp-stack gap="tight">
      <erp-text type="heading-3">آخر تفاعل</erp-text>
      <erp-text type="paragraph" selectable>{{ lastEvent() }}</erp-text>
    </erp-stack>
  </erp-surface>
</erp-stack>
