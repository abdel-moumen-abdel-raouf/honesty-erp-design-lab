<erp-field-frame [label]="label()" [controlId]="controlId" [tone]="tone()" [status]="status()" [variant]="variant()" [borderMode]="effectiveBorderMode()" [shape]="shape()" [size]="size()" [appearance]="appearance()" [labelMode]="labelMode()" [floatingPosition]="floatingPosition()" [helperText]="helperText()" [helperPosition]="helperPosition()" [leadingIcon]="leadingIcon()" [trailingIcon]="trailingIcon()" [clearable]="clearable() && currentValue() !== null" [feedbackText]="feedbackText()" [feedbackDismissible]="feedbackDismissible()" [feedbackVisible]="feedbackVisible()" [focused]="fieldFocused()" [hasDisplayValue]="currentValue() !== null" [disabled]="fieldEffectiveDisabled()" [configurationState]="fieldConfigurationState()" (clearRequested)="handleClear()" (feedbackDismissed)="dismissFeedback()">
  <erp-field-trigger field-control class="color-picker__trigger" [id]="controlId" [name]="name()" [form]="form()" [disabled]="fieldEffectiveDisabled()" [ariaDescribedBy]="fieldAriaDescribedBy(controlId)" [ariaErrorMessage]="fieldAriaErrorMessage(controlId)" [ariaInvalid]="status() === 'danger'" (activated)="openPicker()" (focused)="handleNativeFocus()" (blurred)="handleNativeBlur()">
    @if (currentValue(); as color) { <span class="color-picker__swatch" [style.backgroundColor]="color"></span> }
    <erp-text type="text" tone="inherit" family="latin">{{ displayValue() }}</erp-text>
  </erp-field-trigger>
</erp-field-frame>
