<erp-stack
  class="action-menu"
  gap="tight"
  role="menu"
  (keydown)="handleKeydown($event)"
>
  @for (item of items(); track item.value) {
    <erp-button
      data-action-item
      [attr.data-value]="item.value"
      [label]="item.label"
      [icon]="item.icon ?? null"
      variant="ghost"
      tone="neutral"
      [disabled]="item.disabled ?? false"
      fullWidth
      (pressed)="select(item)"
    />
  }
</erp-stack>
