<fieldset
  class="range-slider"
  [disabled]="rangeEffectiveDisabled()"
  [attr.aria-invalid]="status() === 'danger' ? 'true' : null"
  [attr.aria-describedby]="trimmedHelperText() ? helperId : null"
>
  <legend class="range-slider__legend">
    <erp-text type="label">{{ label() }}</erp-text>
  </legend>

  @if (helperPosition() === 'above' && trimmedHelperText()) {
    <erp-text
      type="caption"
      tone="muted"
      [id]="helperId"
    >{{ trimmedHelperText() }}</erp-text>
  }

  <div
    class="range-slider__surface"
    [style.--_honesty-range-slider-lower]="lowerPosition() + '%'"
    [style.--_honesty-range-slider-upper]="upperPosition() + '%'"
  >
    <div class="range-slider__values" aria-hidden="true">
      <erp-text type="data" [value]="currentValue().lower.toString()">
        {{ currentValue().lower }}
      </erp-text>
      <erp-text type="text">–</erp-text>
      <erp-text type="data" [value]="currentValue().upper.toString()">
        {{ currentValue().upper }}
      </erp-text>
    </div>

    <div class="range-slider__inputs">
      <span class="range-slider__rail" aria-hidden="true"></span>

      <div class="range-slider__tooltip-track" aria-hidden="true">
        <erp-tooltip
          [text]="tooltipText('lower')"
          [placement]="valueTooltipPlacement()"
          [disabled]="!showValueTooltip()"
          [open]="showValueTooltip() && activeThumb() === 'lower'"
        >
          <input
            data-range-tooltip-anchor="lower"
            class="range-slider__tooltip-anchor"
            type="text"
            tabindex="-1"
            readonly
            aria-hidden="true"
            [style.inset-inline-start]="lowerPosition() + '%'"
          />
        </erp-tooltip>

        <erp-tooltip
          [text]="tooltipText('upper')"
          [placement]="valueTooltipPlacement()"
          [disabled]="!showValueTooltip()"
          [open]="showValueTooltip() && activeThumb() === 'upper'"
        >
          <input
            data-range-tooltip-anchor="upper"
            class="range-slider__tooltip-anchor"
            type="text"
            tabindex="-1"
            readonly
            aria-hidden="true"
            [style.inset-inline-start]="upperPosition() + '%'"
          />
        </erp-tooltip>
      </div>
      <input
        data-range-thumb="lower"
        class="range-slider__native"
        type="range"
        [id]="lowerId"
        [attr.name]="name()"
        [attr.form]="form()"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="currentValue().lower"
        [disabled]="rangeEffectiveDisabled()"
        [attr.aria-label]="label() + ' lower'"
        (pointerdown)="handlePointerDown('lower')"
        (pointerup)="handlePointerEnd('lower')"
        (pointercancel)="handlePointerEnd('lower')"
        (input)="handleInput('lower', $event)"
        (keydown)="handleKeyDown('lower', $event)"
        (focus)="handleNativeFocus('lower')"
        (blur)="handleNativeBlur('lower')"
      />
      <input
        data-range-thumb="upper"
        class="range-slider__native"
        type="range"
        [id]="upperId"
        [attr.name]="name()"
        [attr.form]="form()"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="currentValue().upper"
        [disabled]="rangeEffectiveDisabled()"
        [attr.aria-label]="label() + ' upper'"
        (pointerdown)="handlePointerDown('upper')"
        (pointerup)="handlePointerEnd('upper')"
        (pointercancel)="handlePointerEnd('upper')"
        (input)="handleInput('upper', $event)"
        (keydown)="handleKeyDown('upper', $event)"
        (focus)="handleNativeFocus('upper')"
        (blur)="handleNativeBlur('upper')"
      />
    </div>

    @if (clearable()) {
      <erp-tooltip text="Reset range">
        <erp-icon-button
          icon="close"
          label="Reset range"
          variant="ghost"
          tone="neutral"
          size="sm"
          [disabled]="rangeEffectiveDisabled()"
          (pressed)="handleClear()"
        />
      </erp-tooltip>
    }
  </div>

  @if (helperPosition() === 'below' && trimmedHelperText()) {
    <erp-text
      type="caption"
      tone="muted"
      [id]="helperId"
    >{{ trimmedHelperText() }}</erp-text>
  }
</fieldset>
