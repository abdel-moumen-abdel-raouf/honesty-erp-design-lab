<div class="filter-bar__fields"><ng-content /></div>
@if (filters().length > 0) {
  <div class="filter-bar__active" aria-label="عوامل التصفية النشطة">
    @for (filter of filters(); track filter.key) {
      <span class="filter-bar__criterion">
        <erp-status-badge [label]="filter.label + ': ' + filter.value" tone="info" size="sm" />
        <erp-button [label]="'إزالة ' + filter.label" icon="close" variant="ghost" size="sm" [disabled]="disabled()" (pressed)="filterRemoved.emit(filter.key)" />
      </span>
    }
  </div>
}
<div class="filter-bar__actions">
  <erp-button label="تطبيق التصفية" icon="filter" size="sm" [disabled]="disabled()" (pressed)="applyRequested.emit()" />
  <erp-button label="مسح التصفية" icon="refresh" variant="ghost" size="sm" [disabled]="disabled() || filters().length === 0" (pressed)="resetRequested.emit()" />
</div>
