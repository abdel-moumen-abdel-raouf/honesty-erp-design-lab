<erp-table-toolbar
  [label]="caption()"
  [showExport]="true"
  [refreshing]="loading()"
  (refreshRequested)="refreshRequested.emit()"
  (exportRequested)="exportRequested.emit()"
>
  @if (filterDefinitions().length > 0) {
    <erp-filter-drawer
      erpTableToolbarFilters
      [definitions]="filterDefinitions()"
      [filters]="filters()"
      [disabled]="loading()"
      (applied)="changeFilters($event)"
    />
  }
  <erp-column-chooser
    erpTableToolbarColumns
    [columns]="columns()"
    [visibleKeys]="effectiveVisibleKeys()"
    [disabled]="loading()"
    (visibilityChange)="changeVisibleColumns($event)"
    (resetRequested)="resetColumns()"
  />
</erp-table-toolbar>

@if (filters().length > 0) {
  <erp-filter-bar
    [filters]="filters()"
    [disabled]="loading()"
    (filterRemoved)="removeFilter($event)"
    (resetRequested)="changeFilters([])"
    (applyRequested)="applyCurrentFilters()"
  />
}

@if (selectedKeys().length > 0) {
  <erp-bulk-action-bar
    [selectedCount]="selectedKeys().length"
    (clearSelection)="clearSelection()"
  >
    <ng-content select="[erpSmartTableBulkActions]" />
  </erp-bulk-action-bar>
}

<div class="smart-table__body">
  @if (loading()) {
    <erp-skeleton variant="line" [lines]="6" label="جارٍ تحميل بيانات الجدول" />
  } @else if (error(); as message) {
    <erp-alert title="تعذر تحميل البيانات" [description]="message" tone="danger" />
  } @else if (displayedRows().length === 0) {
    <erp-empty-state
      variant="no-data"
      [animated]="false"
      [showActions]="false"
      [showExtra]="false"
    />
  } @else {
    <erp-table
      [caption]="caption()"
      [columns]="tableColumns()"
      [rows]="displayedRows()"
      [rowKey]="rowKey()"
      [compact]="compact()"
      [selectable]="selectable()"
      [selectedKeys]="selectedKeys()"
      [sort]="sort()"
      [cellDefinitions]="effectiveCellDefinitions()"
      rowActivatable
      (selectedKeysChange)="changeSelection($event)"
      (sortChange)="changeSort($event)"
      (rowActivated)="activateRow($event)"
    >
      <ng-content />
    </erp-table>
  }
</div>

<erp-pagination
  [page]="effectivePage()"
  [pageCount]="pageCount()"
  [totalItems]="effectiveTotalItems()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions()"
  (pageChange)="changePage($event)"
  (pageSizeChange)="changePageSize($event)"
/>
