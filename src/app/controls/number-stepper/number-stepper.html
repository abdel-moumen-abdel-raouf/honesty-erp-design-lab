<erp-field-frame
  [label]="label()"
  [controlId]="controlId"
  [tone]="tone()"
  [status]="status()"
  [variant]="variant()"
  [borderMode]="effectiveBorderMode()"
  [shape]="shape()"
  [size]="size()"
  [appearance]="appearance()"
  [labelMode]="labelMode()"
  [floatingPosition]="floatingPosition()"
  [helperText]="helperText()"
  [helperPosition]="helperPosition()"
  [leadingIcon]="leadingIcon()"
  [trailingIcon]="trailingIcon()"
  [clearable]="clearActionVisible()"
  [feedbackText]="feedbackText()"
  [feedbackDismissible]="feedbackDismissible()"
  [feedbackVisible]="feedbackVisible()"
  [focused]="fieldFocused()"
  [hasDisplayValue]="currentValue() !== null"
  [placeholder]="placeholder()"
  [disabled]="fieldEffectiveDisabled()"
  [configurationState]="fieldConfigurationState()"
  (clearRequested)="handleClear(nativeInput)"
  (feedbackDismissed)="dismissFeedback()"
>
  <erp-tooltip field-leading-action text="Decrease value">
    <erp-icon-button
      data-stepper-decrement
      icon="minus"
      label="Decrease value"
      variant="ghost"
      tone="neutral"
      size="sm"
      [disabled]="decrementDisabled()"
      (pressed)="handleStep(nativeInput, -1)"
    />
  </erp-tooltip>

  <input
    #nativeInput
    field-control
    class="number-stepper__native"
    type="number"
    [id]="controlId"
    [attr.name]="name()"
    [attr.form]="form()"
    [value]="currentValue() ?? ''"
    [placeholder]="placeholder() ?? ''"
    [disabled]="fieldEffectiveDisabled()"
    [readOnly]="readonly()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.step]="step()"
    [attr.aria-invalid]="status() === 'danger' ? 'true' : null"
    [attr.aria-describedby]="fieldAriaDescribedBy(controlId)"
    [attr.aria-errormessage]="fieldAriaErrorMessage(controlId)"
    (input)="handleInput($event)"
    (keydown)="handleKeyDown($event, nativeInput)"
    (focus)="handleNativeFocus()"
    (blur)="handleNativeBlur()"
  />

  <erp-tooltip field-domain-action text="Increase value">
    <erp-icon-button
      data-stepper-increment
      icon="plus"
      label="Increase value"
      variant="ghost"
      tone="neutral"
      size="sm"
      [disabled]="incrementDisabled()"
      (pressed)="handleStep(nativeInput, 1)"
    />
  </erp-tooltip>
</erp-field-frame>
