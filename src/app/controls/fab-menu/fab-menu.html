<div class="fab-menu">
  <div
    #actionsSurface
    [id]="menuId"
    class="fab-menu__actions"
    popover="manual"
    role="menu"
    [attr.aria-label]="label()"
    (toggle)="handleSurfaceToggle($event)"
  >
    @for (item of items(); track item.value) {
      @if (item.presentation === 'icon' && item.icon) {
        <erp-tooltip [text]="item.label">
          <erp-fab
            data-fab-menu-action
            [label]="item.label"
            [icon]="item.icon"
            role="menuitem"
            [disabled]="item.disabled ?? false"
            (pressed)="select(item)"
          />
        </erp-tooltip>
      } @else {
        <erp-extended-fab
          data-fab-menu-action
          [label]="item.label"
          [icon]="item.presentation === 'text' ? null : (item.icon ?? null)"
          role="menuitem"
          [disabled]="item.disabled ?? false"
          (pressed)="select(item)"
        />
      }
    }
  </div>

  <erp-fab
    #trigger
    data-fab-menu-trigger
    [icon]="open() ? 'close' : icon()"
    [label]="label()"
    [disabled]="disabled()"
    ariaHasPopup="menu"
    [ariaControls]="menuId"
    [ariaExpanded]="open()"
    (pressed)="toggle()"
  />
</div>
