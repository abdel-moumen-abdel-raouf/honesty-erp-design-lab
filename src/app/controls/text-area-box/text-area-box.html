<erp-field-frame
  [label]="label()"
  [controlId]="controlId"
  [tone]="tone()"
  [status]="status()"
  [variant]="variant()"
  [borderMode]="effectiveBorderMode()"
  [shape]="shape()"
  [size]="size()"
  [appearance]="appearance()"
  [labelMode]="labelMode()"
  [floatingPosition]="floatingPosition()"
  [helperText]="helperText()"
  [helperPosition]="helperPosition()"
  [leadingIcon]="leadingIcon()"
  [trailingIcon]="trailingIcon()"
  [clearable]="clearActionVisible()"
  [feedbackText]="feedbackText()"
  [feedbackDismissible]="feedbackDismissible()"
  [feedbackVisible]="feedbackVisible()"
  [focused]="fieldFocused()"
  [hasDisplayValue]="currentValue().length > 0"
  [placeholder]="placeholder()"
  [disabled]="fieldEffectiveDisabled()"
  [configurationState]="fieldConfigurationState()"
  multiline
  (clearRequested)="handleClear(nativeTextArea)"
  (feedbackDismissed)="dismissFeedback()"
>
  <textarea
    #nativeTextArea
    field-control
    class="text-area-box__native"
    [id]="controlId"
    [attr.name]="name()"
    [attr.form]="form()"
    [value]="currentValue()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="fieldEffectiveDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.minlength]="minLength()"
    [attr.maxlength]="maxLength()"
    [rows]="rows()"
    [attr.aria-invalid]="status() === 'danger' ? 'true' : null"
    [attr.aria-describedby]="fieldAriaDescribedBy(controlId)"
    [attr.aria-errormessage]="fieldAriaErrorMessage(controlId)"
    (input)="handleInput($event)"
    (focus)="handleNativeFocus()"
    (blur)="handleNativeBlur()"
  ></textarea>

  @if (counterVisible()) {
    <erp-text field-trailing type="caption" tone="muted">
      {{ currentValue().length }} / {{ maxLength() }}
    </erp-text>
  }
</erp-field-frame>
