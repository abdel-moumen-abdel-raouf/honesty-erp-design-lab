<erp-field-frame
  [label]="label()"
  [controlId]="controlId"
  [tone]="tone()"
  [status]="effectiveFieldStatus()"
  [variant]="variant()"
  [borderMode]="effectiveBorderMode()"
  [shape]="shape()"
  [size]="size()"
  [appearance]="appearance()"
  [labelMode]="labelMode()"
  [floatingPosition]="floatingPosition()"
  [helperText]="helperText()"
  [helperPosition]="helperPosition()"
  [leadingIcon]="leadingIcon()"
  [trailingIcon]="trailingIcon()"
  [clearable]="clearActionVisible()"
  [feedbackText]="effectiveFeedbackText()"
  [feedbackDismissible]="feedbackDismissible()"
  [feedbackVisible]="effectiveFeedbackVisible()"
  [focused]="urlFocused()"
  [hasDisplayValue]="displayValue().length > 0"
  [placeholder]="placeholder()"
  [disabled]="urlEffectiveDisabled()"
  [configurationState]="urlConfigurationState()"
  (clearRequested)="handleClear(nativeInput)"
  (feedbackDismissed)="dismissFeedback()"
>
  <input
    #nativeInput
    field-control
    class="url-box__native"
    type="url"
    inputmode="url"
    [id]="controlId"
    [attr.name]="name()"
    [attr.form]="form()"
    [value]="displayValue()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="urlEffectiveDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.minlength]="minLength()"
    [attr.autocomplete]="autocomplete()"
    [attr.pattern]="effectivePatternExpression()"
    [attr.aria-invalid]="effectiveFieldStatus() === 'danger' ? 'true' : null"
    [attr.aria-describedby]="fieldAriaDescribedBy(controlId)"
    [attr.aria-errormessage]="fieldAriaErrorMessage(controlId)"
    (input)="handleInput($event)"
    (focus)="handleNativeFocus()"
    (blur)="handleNativeBlur()"
  />
</erp-field-frame>
