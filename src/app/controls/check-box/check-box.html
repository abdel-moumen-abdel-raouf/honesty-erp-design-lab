<label class="check-box" [for]="controlId" [attr.data-variant]="variant()">
  <span class="check-box__control">
    <input
      class="check-box__native"
      type="checkbox"
      [id]="controlId"
      [attr.name]="name()"
      [attr.form]="form()"
      [checked]="currentValue()"
      [indeterminate]="indeterminate()"
      [required]="required()"
      [attr.aria-invalid]="valid() ? null : 'true'"
      [disabled]="effectiveDisabled()"
      (change)="handleChange($event)"
      (focus)="handleNativeFocus()"
      (blur)="handleNativeBlur()"
    />
    <span class="check-box__visual" aria-hidden="true"></span>
  </span>

  <span class="check-box__text">
    <erp-text
      class="check-box__title"
      type="span"
      size="inherit"
      weight="inherit"
      lineHeight="inherit"
      tone="inherit"
    >
      {{ trimmedLabel() }}
    </erp-text>
    @if (trimmedDescription()) {
      <erp-text
        class="check-box__description"
        type="span"
        size="inherit"
        weight="inherit"
        lineHeight="inherit"
        tone="inherit"
      >
        {{ trimmedDescription() }}
      </erp-text>
    }
  </span>
</label>
