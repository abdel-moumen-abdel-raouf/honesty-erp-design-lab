<div class="sidebar__header">
  <erp-tooltip [text]="collapseLabel()" placement="end">
    <erp-icon-button
      icon="menu"
      [label]="collapseLabel()"
      size="md"
      shape="pill"
      [ariaExpanded]="!collapsed()"
      (pressed)="toggleCollapsed()"
    />
  </erp-tooltip>
  <erp-text class="sidebar__title" type="caption" tone="secondary" weight="medium">
    {{ label() }}
  </erp-text>
</div>

<nav [id]="instanceId" [attr.aria-label]="label()">
  <ul>
    @for (entry of entries(); track entry.item.id) {
      <li
        [hidden]="!entry.visible"
        [attr.data-sidebar-level]="entry.level"
        [attr.data-sidebar-group]="entry.group"
        [attr.data-sidebar-active-ancestor]="entry.activeAncestor"
        [style.--_honesty-sidebar-level]="entry.level"
      >
        @if (entry.group) {
          <erp-sidebar-disclosure
            [item]="entry.item"
            [expanded]="isExpanded(entry.item.id)"
            [active]="entry.activeAncestor"
            [collapsed]="collapsed()"
            (toggled)="toggleGroup(entry.item)"
          />
        } @else {
          <erp-sidebar-link
            [item]="entry.item"
            [active]="activeId() === entry.item.id"
            [collapsed]="collapsed()"
            (activated)="activate($event)"
          />
        }
      </li>
    }
  </ul>
</nav>
