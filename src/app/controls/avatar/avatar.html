<erp-avatar-action
  [interactive]="interactive()"
  [label]="accessibleLabel()"
  (action)="activate($event)"
>
  <erp-avatar-frame>
    @if (!loading()) {
      @if (imageVisible()) {
        <img
          class="avatar__image"
          [src]="src()!"
          [attr.loading]="imageLoading()"
          decoding="async"
          alt=""
          aria-hidden="true"
          (error)="failImage()"
        />
      } @else if (effectiveIcon(); as icon) {
        <erp-icon
          class="avatar__icon"
          [name]="icon"
          size="inherit"
          tone="inherit"
        />
      } @else {
        <erp-text
          class="avatar__initials"
          type="span"
          size="inherit"
          tone="inherit"
          weight="inherit"
          lineHeight="tight"
        >{{ effectiveInitials() }}</erp-text>
      }
    }
  </erp-avatar-frame>
</erp-avatar-action>

@if (presence()) {
  <erp-avatar-presence aria-hidden="true" />
}
