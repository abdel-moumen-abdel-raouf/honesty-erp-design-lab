<erp-field-frame [label]="label()" [controlId]="controlId" [tone]="tone()" [status]="status()" [variant]="variant()" [borderMode]="effectiveBorderMode()" [shape]="shape()" [size]="size()" [appearance]="appearance()" [labelMode]="labelMode()" [floatingPosition]="floatingPosition()" [helperText]="helperText()" [helperPosition]="helperPosition()" [leadingIcon]="leadingIcon()" [trailingIcon]="trailingIcon()" [clearable]="currentValue() !== null || query().length > 0" [feedbackText]="feedbackText()" [feedbackDismissible]="feedbackDismissible()" [feedbackVisible]="feedbackVisible()" [focused]="fieldFocused()" [hasDisplayValue]="inputValue().length > 0" [placeholder]="placeholder()" [disabled]="fieldEffectiveDisabled()" [configurationState]="fieldConfigurationState()" (clearRequested)="handleClear(nativeInput)" (feedbackDismissed)="dismissFeedback()">
