<div class="user-menu__trigger">
  <erp-avatar
    class="user-menu__trigger-avatar"
    [name]="user().displayName"
    [src]="user().avatarSrc ?? null"
    [fallbackIcon]="user().fallbackIcon ?? 'user'"
    presentation="user-menu-trigger"
    [bordered]="false"
  />
  <erp-text class="user-menu__trigger-name" type="span" weight="medium">
    {{ user().displayName }}
  </erp-text>
  <erp-button
    #trigger
    class="user-menu__trigger-action"
    [label]="label()"
    variant="ghost"
    tone="neutral"
    presentation="user-menu-trigger"
    ariaHasPopup="menu"
    [ariaControls]="surfaceId"
    [ariaExpanded]="open()"
    (keydown)="handleTriggerKeydown($event)"
    (pressed)="toggle()"
  />
</div>

<section
  #surface
  class="user-menu__surface"
  popover="manual"
  role="menu"
  tabindex="-1"
  [id]="surfaceId"
  [attr.aria-label]="label()"
  (keydown)="handleMenuKeydown($event)"
>
  <header class="user-menu__identity-header">
    <erp-avatar
      [name]="user().displayName"
      [src]="user().avatarSrc ?? null"
      [fallbackIcon]="user().fallbackIcon ?? 'user'"
      presentation="user-menu-identity"
      [bordered]="false"
    />
    <span class="user-menu__identity">
      <erp-text type="span" weight="medium">{{ user().displayName }}</erp-text>
      @if (user().secondaryText) {
        <erp-text type="caption" tone="secondary">
          {{ user().secondaryText }}
        </erp-text>
      }
    </span>
  </header>

  <erp-divider class="user-menu__divider" />

  <div class="user-menu__items">
    @for (item of items(); track item.id) {
      @if (item.dividerBefore) {
        <erp-divider class="user-menu__divider" />
      }
      <erp-button
        [role]="'menuitem'"
        [label]="item.label"
        [icon]="item.icon ?? null"
        variant="ghost"
        [tone]="item.tone ?? 'neutral'"
        presentation="user-menu-action"
        fullWidth
        [disabled]="item.disabled ?? false"
        (pressed)="activate(item)"
      />
    }
  </div>
</section>
