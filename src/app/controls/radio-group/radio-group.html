<fieldset
  class="radio-group"
  [disabled]="effectiveDisabled()"
  [attr.aria-required]="required()"
  [attr.aria-invalid]="valid() ? null : 'true'"
  [attr.aria-readonly]="readOnly() ? 'true' : null"
  (keydown)="handleKeydown($event)"
>
  <legend><erp-text type="label">{{ label() }}</erp-text></legend>

  <div class="radio-group__options">
    @for (option of options(); track option.value) {
      <erp-radio-box
        [label]="option.label"
        [description]="option.description ?? null"
        [name]="coordinatedName()"
        [form]="form()"
        [disabled]="effectiveDisabled() || (option.disabled ?? false)"
        [readOnly]="readOnly()"
        [mode]="mode()"
        [variant]="variant()"
        [tone]="tone()"
        [status]="effectiveStatus()"
        [size]="size()"
        [attr.data-radio-value]="option.value"
        [attr.value]="option.value"
        [ngModel]="currentValue() === option.value"
        (ngModelChange)="select(option, $event)"
      />
    }
  </div>
</fieldset>
