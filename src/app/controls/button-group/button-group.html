<div class="button-group" role="group" [attr.aria-label]="ariaLabel()">
  @for (item of items(); track item.value; let index = $index) {
    <erp-button
      [attr.data-group-position]="position(index)"
      [attr.data-attached-axis]="
        attached()
          ? orientation() === 'horizontal'
            ? 'inline'
            : 'block'
          : null
      "
      [attr.data-attached-position]="attached() ? position(index) : null"
      [label]="item.label"
      [icon]="item.icon ?? null"
      [disabled]="item.disabled ?? false"
      (pressed)="itemPressed.emit(item.value)"
    />
  }
</div>
